<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мақола - Dr. Universal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #38bdf8; --dark-bg: #090d16; --card-bg: rgba(15, 23, 42, 0.85); --border-glow: rgba(56, 189, 248, 0.3); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--dark-bg); color: #f8fafc; min-height: 100vh; padding: 2rem 1rem; }
        
        .post-container { max-width: 800px; margin: 0 auto; background: var(--card-bg); border: 1px solid var(--border-glow); padding: 3rem; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); backdrop-filter: blur(15px); }
        
        .back-btn { display: inline-block; color: #94a3b8; text-decoration: none; font-size: 0.9rem; margin-bottom: 2rem; transition: 0.3s; }
        .back-btn:hover { color: var(--primary); }

        h1 { color: #fff; font-size: 2.2rem; margin-bottom: 1.5rem; line-height: 1.3; }
        
        .media-box { width: 100%; margin-bottom: 2rem; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .media-box img, .media-box iframe { width: 100%; max-height: 450px; object-fit: cover; border: none; display: block; }
        
        .post-text { color: #cbd5e1; font-size: 1.05rem; line-height: 1.8; white-space: pre-line; }
    </style>
</head>
<body>

    <div class="post-container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left" style="margin-right: 6px;"></i> Асосий саҳифага қайтиш</a>
        
        <div id="post-content-box">
            <!-- JavaScript мақола маълумотларини шу ерга юклайди -->
            <p style="text-align: center; color: #94a3b8;">Юкланмоқда...</p>
        </div>
    </div>

    <!-- Firebase SDK va Postni o'qish logikasi -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZmmcH3NZfV0-KUtV3-vgrWm_NSuBqouc",
            authDomain: "druniversal-1e65c.firebaseapp.com",
            databaseURL: "https://druniversal-1e65c-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "druniversal-1e65c",
            storageBucket: "druniversal-1e65c.firebasestorage.app",
            messagingSenderId: "64653989178",
            appId: "1:64653989178:web:5a2df8e7465efe97a2ec03",
            measurementId: "G-VKSDLVSZXD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');
            const box = document.getElementById('post-content-box');

            if (!postId) {
                box.innerHTML = `<h2 style="color:#ef4444; text-align:center;">Мақола ID си топилмади!</h2><p style="text-align:center; margin-top:1rem;"><a href="index.html" style="color:var(--primary);">Бош саҳифага қайтиш</a></p>`;
                return;
            }

            // Firebase'dan berilgan ID bo'yicha postni izlaymiz
            const postRef = ref(db, `posts/${postId}`);
            get(postRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const post = snapshot.val();
                    let mediaHtml = '';

                    if (post.type === 'image') {
                        mediaHtml = `<div class="media-box"><img src="${post.content}" alt="Мақола расми"></div>`;
                    } else {
                        mediaHtml = `<div class="media-box" style="padding: 1rem; background: #0f172a;">${post.content}</div>`;
                    }

                    box.innerHTML = `
                        <h1>${post.title}</h1>
                        ${mediaHtml}
                        <div class="post-text">${post.desc}</div>
                    `;
                } else {
                    box.innerHTML = `<h2 style="color:#ef4444; text-align:center;">Кечирасиз, бундай мақола топилмади!</h2><p style="text-align:center; margin-top:1rem;"><a href="index.html" style="color:var(--primary);">Бош саҳифага қайтиш</a></p>`;
                }
            }).catch((error) => {
                box.innerHTML = `<h2 style="color:#ef4444; text-align:center;">Хатолик юз берди!</h2><p style="text-align:center; color:#94a3b8;">${error.message}</p>`;
            });
        });
    </script>
</body>
</html>
