<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мақола - Dr. Universal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #38bdf8;
            --dark-bg: #030712;
            --card-bg: rgba(15, 23, 42, 0.88);
            --border-glow: rgba(56, 189, 248, 0.28);
            --border-subtle: rgba(148, 163, 184, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            background-image:
                radial-gradient(circle at 20% 15%, rgba(2, 132, 199, 0.2), transparent 45%),
                radial-gradient(circle at 80% 25%, rgba(13, 148, 136, 0.16), transparent 45%),
                linear-gradient(180deg, #030712 0%, #070d1d 60%, #030712 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .post-wrapper {
            max-width: 780px;
            margin: 0 auto;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 22px;
            padding: 2rem;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6);
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #7dd3fc;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 1.4rem;
            padding: 8px 14px;
            border-radius: 50px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            transition: 0.2s;
        }
        .back-btn:hover {
            background: rgba(56, 189, 248, 0.22);
        }
        .post-title {
            font-size: 1.65rem;
            line-height: 1.3;
            margin-bottom: 1rem;
            color: var(--text-main);
        }
        .media-box img {
            width: 100%;
            max-height: 460px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid var(--border-subtle);
            margin-bottom: 1rem;
        }
        .video-box iframe {
            width: 100%;
            height: 390px;
            border-radius: 14px;
            border: 1px solid var(--border-subtle);
            margin-bottom: 1rem;
        }
        .source-card {
            background: rgba(2, 6, 23, 0.75);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 1rem 1.2rem;
            margin: 1rem 0 1.4rem 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .source-label {
            font-size: 0.88rem;
            color: #cbd5e1;
            word-break: break-word;
        }
        .source-label i {
            color: var(--primary);
            margin-right: 6px;
        }
        .official-link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #0284c7, #0d9488);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 11px 18px;
            border-radius: 10px;
            border: 1px solid rgba(125, 211, 252, 0.35);
            box-shadow: 0 0 18px rgba(14, 165, 233, 0.35);
            transition: 0.25s;
            width: fit-content;
        }
        .official-link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 24px rgba(20, 184, 166, 0.5);
        }
        .post-desc {
            color: #cbd5e1;
            font-size: 0.98rem;
            line-height: 1.65;
            white-space: pre-line;
        }
        @media (max-width: 600px) {
            .post-wrapper { padding: 1.3rem; }
            .post-title { font-size: 1.3rem; }
            .video-box iframe { height: 230px; }
        }
    </style>
</head>
<body>
    <div class="post-wrapper">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Асосий саҳифага қайтиш</a>
        <div id="post-content-area">
            <p style="color:#94a3b8;">Мақола юкланмоқда...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZmmcH3NZfV0-KUtV3-vgrWm_NSuBqouc",
            authDomain: "druniversal-1e65c.firebaseapp.com",
            databaseURL: "https://druniversal-1e65c-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "druniversal-1e65c",
            storageBucket: "druniversal-1e65c.firebasestorage.app",
            messagingSenderId: "64653989178",
            appId: "1:64653989178:web:5a2df8e7465efe97a2ec03",
            measurementId: "G-VKSDLVSZXD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const params = new URLSearchParams(window.location.search);
        const postId = params.get('id');
        const area = document.getElementById('post-content-area');

        function sanitizeUrl(url) {
            const raw = (url || '').trim();
            if (!raw) return '';
            const fixed = /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
            try {
                const u = new URL(fixed);
                if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
            } catch (e) {}
            return '';
        }

        if (!postId) {
            area.innerHTML = '<p style="color:#fca5a5;">Хабар ID топилмади.</p>';
        } else {
            onValue(ref(db, `posts/${postId}`), (snapshot) => {
                const post = snapshot.val();
                if (!post) {
                    area.innerHTML = '<p style="color:#fca5a5;">Бу хабар топилмади ёки ўчирилган.</p>';
                    return;
                }

                let mediaHtml = '';
                if (post.type === 'image') {
                    mediaHtml = `<div class="media-box"><img src="${post.content}" alt="${post.title || 'Расм'}"></div>`;
                } else {
                    mediaHtml = `<div class="video-box">${post.content || ''}</div>`;
                }

                const safeUrl = sanitizeUrl(post.sourceUrl);
                const sourceText = post.imageSource
                    ? `<div class="source-label"><i class="fa-solid fa-camera"></i> <b>Расм / материал манбаси:</b> ${post.imageSource}</div>`
                    : '';

                const buttonHtml = safeUrl
                    ? `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer" class="official-link-btn"><i class="fa-solid fa-arrow-up-right-from-square"></i> Расмий хабар манбасига ўтиш</a>`
                    : '';

                const sourceBlock = (sourceText || buttonHtml)
                    ? `<div class="source-card">${sourceText}${buttonHtml}</div>`
                    : '';

                area.innerHTML = `
                    <h1 class="post-title">${post.title || ''}</h1>
                    ${mediaHtml}
                    ${sourceBlock}
                    <div class="post-desc">${post.desc || ''}</div>
                `;
            });
        }
    </script>
</body>
</html>
